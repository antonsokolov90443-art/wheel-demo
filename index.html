<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Фортуны для Ресторана</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { position: relative; text-align: center; }
        .wheel-wrapper { position: relative; width: 300px; height: 300px; margin: 0 auto 30px; }
        .pointer { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid #d4af37; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 10px solid #d4af37; box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); transition: transform 5s cubic-bezier(0.25, 0.1, 0.1, 1); position: relative; background: conic-gradient(
            #ff4d4d 0deg 60deg, 
            #1e1e1e 60deg 120deg, 
            #d4af37 120deg 180deg, 
            #1e1e1e 180deg 240deg, 
            #ff4d4d 240deg 300deg, 
            #1e1e1e 300deg 360deg
        ); }
        button { background-color: #d4af37; color: #121212; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); }
        button:hover { background-color: #ffd700; transform: scale(1.05); }
        button:disabled { background-color: #555; cursor: not-allowed; box-shadow: none; transform: none; }
        .result { margin-top: 25px; font-size: 24px; color: #d4af37; font-weight: bold; min-height: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>
        <button id="spinBtn" onclick="spinWheel()">Крутить!</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const result = document.getElementById('result');
        
        const prizes = [
            "Скидка 10%", 
            "Бесплатный десерт 🍰", 
            "Скидка 20%", 
            "Напиток в подарок ☕", 
            "Попробуй еще раз 🎲", 
            "Скидка 15%"
        ];

        let currentRotation = 0;

        function spinWheel() {
            spinBtn.disabled = true;
            result.innerText = "";
            
            // Случайное количество оборотов (от 5 до 10) + случайный угол
            const extraRotation = 1800 + Math.random() * 1800; 
            currentRotation += extraRotation;
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            
            setTimeout(() => {
                // Вычисляем выигрышный сектор (360 градусов / 6 секторов = 60 градусов)
                const normalizedRotation = currentRotation % 360;
                let sectorIndex = Math.floor((360 - (normalizedRotation % 360)) / 60);
                
                if (sectorIndex >= prizes.length) sectorIndex = 0;
                
                const wonPrize = prizes[sectorIndex];
                result.innerText = "Ваш приз: " + wonPrize + "!";
                
                spinBtn.disabled = false;
            }, 5000); // 5 секунд анимации
        }
    </script>
</body>
</html>
