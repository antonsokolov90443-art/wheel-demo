<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Фортуны - Премиум</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

        body { 
            background-color: #020813; 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow: hidden;
            background-image: radial-gradient(circle at center, #0a2a5e 0%, #020813 70%);
        }

        .container { 
            position: relative; 
            text-align: center; 
            padding: 20px;
        }

        .wheel-wrapper { 
            position: relative; 
            width: 340px; 
            height: 340px; 
            margin: 0 auto 40px; 
            box-shadow: 0 0 60px rgba(0, 150, 255, 0.4), inset 0 0 20px rgba(0, 150, 255, 0.2);
            border-radius: 50%;
        }

        .pointer { 
            position: absolute; 
            top: -15px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 30px; 
            height: 40px; 
            background: linear-gradient(135deg, #ffe066, #d4af37, #b8860b);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            z-index: 20; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 -2px 5px rgba(255,255,255,0.5);
        }

        .wheel { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 12px solid #d4af37; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.6); 
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.1, 1); 
            position: relative; 
            background: conic-gradient(
                #d32f2f 0deg 30deg, 
                #f5f5f5 30deg 60deg,
                #d32f2f 60deg 90deg, 
                #f5f5f5 90deg 120deg,
                #d32f2f 120deg 150deg, 
                #f5f5f5 150deg 180deg,
                #d32f2f 180deg 210deg, 
                #f5f5f5 210deg 240deg,
                #d32f2f 240deg 270deg, 
                #f5f5f5 270deg 300deg,
                #d32f2f 300deg 330deg, 
                #f5f5f5 330deg 360deg
            ); 
            overflow: hidden;
        }

        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ffe066, #d4af37, #b8860b);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .icon {
            position: absolute;
            top: calc(50% - 20px); 
            left: calc(50% - 20px); 
            width: 40px;
            height: 40px;
            font-size: 32px; 
            line-height: 40px;
            text-align: center;
            z-index: 5;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .icon-1 { transform: rotate(15deg) translateY(-115px) rotate(-15deg); }
        .icon-2 { transform: rotate(45deg) translateY(-115px) rotate(-45deg); }
        .icon-3 { transform: rotate(75deg) translateY(-115px) rotate(-75deg); }
        .icon-4 { transform: rotate(105deg) translateY(-115px) rotate(-105deg); }
        .icon-5 { transform: rotate(135deg) translateY(-115px) rotate(-135deg); }
        .icon-6 { transform: rotate(165deg) translateY(-115px) rotate(-165deg); }
        .icon-7 { transform: rotate(195deg) translateY(-115px) rotate(-195deg); }
        .icon-8 { transform: rotate(225deg) translateY(-115px) rotate(-225deg); }
        .icon-9 { transform: rotate(255deg) translateY(-115px) rotate(-255deg); }
        .icon-10 { transform: rotate(285deg) translateY(-115px) rotate(-285deg); }
        .icon-11 { transform: rotate(315deg) translateY(-115px) rotate(-315deg); }
        .icon-12 { transform: rotate(345deg) translateY(-115px) rotate(-345deg); }

        button { 
            background: linear-gradient(to bottom, #ffe066, #d4af37); 
            color: #000; 
            border: none; 
            padding: 15px 60px; 
            font-size: 22px; 
            font-weight: 900; 
            border-radius: 40px; 
            cursor: pointer; 
            transition: 0.3s; 
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.5), inset 0 -3px 0 rgba(0,0,0,0.2); 
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        button:hover { 
            transform: translateY(-2px) scale(1.05); 
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.7);
        }

        button:disabled { 
            background: #555;
            box-shadow: none; 
            color: #888;
            cursor: not-allowed; 
            transform: none; 
        }

        .result { 
            margin-top: 30px; 
            font-size: 26px; 
            color: #ffe066; 
            font-weight: 900; 
            min-height: 35px; 
            text-shadow: 0 0 15px rgba(255, 224, 102, 0.6);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <div class="icon icon-1">🍰</div>
                <div class="icon icon-2">☕</div>
                <div class="icon icon-3">🍔</div>
                <div class="icon icon-4">10%</div>
                <div class="icon icon-5">🍕</div>
                <div class="icon icon-6">🎁</div>
                <div class="icon icon-7">🍰</div>
                <div class="icon icon-8">☕</div>
                <div class="icon icon-9">🍔</div>
                <div class="icon icon-10">20%</div>
                <div class="icon icon-11">🍕</div>
                <div class="icon icon-12">🎁</div>
            </div>
        </div>
        <button id="spinBtn" onclick="spinWheel()">Крутить</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const result = document.getElementById('result');
        
        // Призы должны идти строго в том же порядке, что и картинки!
        const prizes = [
            "Десерт 🍰", 
            "Напиток ☕", 
            "Бургер 🍔", 
            "Скидка 10%", 
            "Пицца 🍕", 
            "Подарок 🎁",
            "Десерт 🍰", 
            "Напиток ☕", 
            "Бургер 🍔", 
            "Скидка 20%", 
            "Пицца 🍕", 
            "Подарок 🎁"
        ];

        let currentRotation = 0;

        function spinWheel() {
            spinBtn.disabled = true;
            result.innerText = "";
            
            // 1. Выбираем случайный индекс от 0 до 11
            const targetIndex = Math.floor(Math.random() * 12);
            const targetPrize = prizes[targetIndex];
            
            // 2. Вычисляем центр нужного сектора (от 0 до 360 градусов)
            // Индекс 0 - это от 0 до 30 град (центр 15). Индекс 1 - от 30 до 60 (центр 45).
            const sectorCenter = (targetIndex * 30) + 15;
            
            // 3. Вычисляем, на сколько градусов нужно повернуть колесо, чтобы этот центр оказался вверху (на 0 градусов)
            // Если центр на 15 град, нам нужно повернуть на 360 - 15 = 345 град.
            const targetAngle = 360 - sectorCenter;
            
            // 4. Добавляем 5 полных оборотов (5 * 360 = 1800) для красоты
            // и прибавляем остаток от прошлого вращения, чтобы колесо не дергалось назад
            const currentMod = currentRotation % 360;
            const rotationToAdd = 1800 + targetAngle - currentMod;
            
            currentRotation += rotationToAdd;
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            
            setTimeout(() => {
                result.innerText = "Ваш приз: " + targetPrize + "!";
                spinBtn.disabled = false;
            }, 5000); 
        }
    </script>
</body>
</html>
